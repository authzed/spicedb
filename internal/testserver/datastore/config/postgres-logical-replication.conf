listen_addresses = '*'
max_connections = 3000
track_commit_timestamp = 1
wal_level = logical
# The commit LSN ledger's slot is durable, and every test database creates its
# own, so slots accumulate for the lifetime of the container rather than being
# released when a datastore closes. The limit therefore has to cover every
# database a test binary creates, not just the ones live at any moment.
max_replication_slots = 400
max_wal_senders = 100
