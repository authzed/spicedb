# yaml-language-server: $schema=https://goreleaser.com/static/schema-pro.json
---
version: 2
builds:
  - main: "./cmd/spicedb"
    env:
      - "CGO_ENABLED=0"
    goos:
      - "linux"
    goarch:
      - "amd64"
      - "arm64"
    mod_timestamp: "{{ .CommitTimestamp }}"
    tags:
      - "memoryprotection"
    ldflags:
      - "-s -w -checklinkname=0"
      - "-X github.com/jzelinskie/cobrautil/v2.Version=v{{ .Version }}"
# Keep in sync with dockers_v2 in .goreleaser.yml so nightly images match release images.
dockers_v2:
  # Standard images
  - id: "standard"
    dockerfile: "Dockerfile.release"
    platforms:
      - "linux/amd64"
      - "linux/arm64"
    images:
      - "quay.io/authzed/spicedb-git"
      - "ghcr.io/authzed/spicedb-git"
      - "authzed/spicedb-git"
    tags:
      - "v{{ .Version }}"
      - "latest"
  # Debug images
  - id: "debug"
    dockerfile: "Dockerfile.release"
    platforms:
      - "linux/amd64"
      - "linux/arm64"
    images:
      - "quay.io/authzed/spicedb-git"
      - "ghcr.io/authzed/spicedb-git"
      - "authzed/spicedb-git"
    tags:
      - "v{{ .Version }}-debug"
      - "latest-debug"
    build_args:
      BASE: "cgr.dev/chainguard/busybox"
checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ incpatch .Version }}-next"
nightly:
  version_template: "{{ incpatch .Version }}-{{ .ShortCommit }}"
