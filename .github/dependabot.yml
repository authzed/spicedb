---
version: 2
updates:
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/magefiles"
      - "/e2e"
      - "/tools/analyzers"
    # Every other Monday at 09:00 UTC. Dependabot parses cron with the fugit
    # library, whose "%" modulo extension is how a two-week cadence is
    # expressed; plain intervals only offer daily/weekly/monthly.
    schedule:
      interval: "cron"
      cronjob: "0 9 * * mon%2"
    # "dependencies" is Dependabot's default label, but setting "labels"
    # replaces the defaults instead of adding to them. The changelog enforcer
    # in keep-a-changelog.yaml skips on it, so it has to be listed explicitly.
    labels:
      - "area/dependencies"
      - "dependencies"
    # cobrautil's cobraproclimits calls memlimit.SetGoMemLimitWithOpts, which
    # automemlimit v1 renamed to memlimit.Set. Hold the major back until
    # cobrautil is updated, otherwise the whole module stops compiling.
    ignore:
      - dependency-name: "github.com/KimMachineGun/automemlimit"
        update-types: ["version-update:semver-major"]
      # grpc-go v1.84.0 is affected by CVE-2026-84445; the fix shipped in
      # v1.83.2 and will land again in the release after v1.84.0.
      - dependency-name: "google.golang.org/grpc"
        versions: ["1.84.0"]
    groups:
      # A group only covers the update type named by "applies-to", which
      # defaults to "version-updates". Without a second, separately named
      # group for "security-updates", advisory-triggered updates ignore
      # grouping and open one pull request per affected module.
      go-mod:
        applies-to: "version-updates"
        patterns: ["*"]
      go-mod-security:
        applies-to: "security-updates"
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 9 * * mon%2"
    labels:
      - "area/dependencies"
      - "dependencies"
    groups:
      docker:
        applies-to: "version-updates"
        patterns: ["*"]
      docker-security:
        applies-to: "security-updates"
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        applies-to: "version-updates"
        patterns: ["*"]
      github-actions-security:
        applies-to: "security-updates"
        patterns: ["*"]
