# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: "Build & Test"
on: # yamllint disable-line rule:truthy
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "**"
  merge_group:
    types:
      - "checks_requested"
permissions:
  contents: "read"
concurrency:
  group: "spicedb-test-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true
env:
  DOCKERHUB_PUBLIC_ACCESS_TOKEN: "dckr_pat_8AEETZWxu8f7FvJUk9NrpyX_ZEQ"
  DOCKERHUB_PUBLIC_USER: "spicedbgithubactions"
jobs:
  paths-filter:
    runs-on: "depot-ubuntu-24.04-arm-small"
    outputs:
      codechange: "${{ steps.code-filter.outputs.codechange }}"
      protochange: "${{ steps.proto-filter.outputs.protochange }}"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      - uses: "dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d" # v4.0.3
        id: "code-filter"
        with:
          filters: |
            codechange:
              - ".github/workflows/build-test.yaml"
              - "Dockerfile"
              - "go.mod"
              - "go.sum"
              - "cmd/**"
              - "pkg/**"
              - "e2e/**"
              - "internal/**"
      - uses: "dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d" # v4.0.3
        id: "proto-filter"
        with:
          filters: |
            protochange:
              - "buf.gen.yaml"
              - "buf.work.yaml"
              - "proto/**"
              - "go.mod"
  build:
    name: "Build Binary & Image"
    # The image tests start a SpiceDB container and a Postgres container and then
    # drive 200k fully-consistent Checks through them. Measured CPU appetite of that
    # workload is ~6.5 cores for SpiceDB, ~1.4 for Postgres and ~0.4 for the test
    # client, so on a 4-vCPU runner it spent most of its time waiting for a core.
    runs-on: "depot-ubuntu-24.04-arm-16"
    needs: "paths-filter"
    permissions:
      contents: "read"
      # Lets the job exchange a GitHub OIDC token for Depot credentials, so no
      # Depot token has to be stored as a secret.
      id-token: "write"
    env:
      # Empty for pull requests from forks, which get no repository secrets. That
      # is deliberate: see the note on the depot step below.
      DEPOT_PROJECT_ID: "${{ secrets.DEPOT_PROJECT_ID }}"
    if: |
      needs.paths-filter.outputs.codechange == 'true'
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      - uses: "authzed/actions/setup-go@main"
      - uses: "docker/login-action@dbcb813823bdd20940b903addbd779551569679f" # v4.6.0
        with:
          username: "${{ env.DOCKERHUB_PUBLIC_USER }}"
          password: "${{ env.DOCKERHUB_PUBLIC_ACCESS_TOKEN }}"
      - uses: "authzed/actions/go-build@70432bd54a9e690d7fe19817dda46d8e4c0a2c3a" # main
        with:
          ldflags: "-checklinkname=0"
      # Skipped for pull requests from forks, which then build the image with plain
      # `docker build`, exactly as today. That is on purpose: a build triggered by
      # an untrusted contributor should not reach a persistent cache that later
      # feeds trusted builds.
      - uses: "depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c" # v1
        if: "${{ env.DEPOT_PROJECT_ID != '' }}"
      - name: "Image tests"
        run: "go run mage.go test:image"

  unit:
    name: "Unit"
    runs-on: "depot-ubuntu-24.04-arm-8"
    needs: "paths-filter"
    if: |
      needs.paths-filter.outputs.codechange == 'true'
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      - uses: "authzed/actions/setup-go@main"
      - name: "Unit tests with coverage"
        run: "go run mage.go test:unitCover"
      - name: "Coverage"
        uses: "codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5" # v7.1.1
        with:
          files: "./coverage.txt"
          token: "${{ secrets.CODECOV_TOKEN }}"
          fail_ci_if_error: false

  steelthread:
    name: "Steelthread"
    runs-on: "depot-ubuntu-24.04-arm-4"
    needs: "paths-filter"
    if: |
      needs.paths-filter.outputs.codechange == 'true'
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      - uses: "authzed/actions/setup-go@main"
      - name: "Steelthread tests"
        run: "go run mage.go test:steelthread"

  integration:
    name: "Integration Tests"
    # TODO: make these use arm once we find a set of compatible packages
    runs-on: "depot-ubuntu-24.04-8"
    needs: "paths-filter"
    if: |
      needs.paths-filter.outputs.codechange == 'true'
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      - uses: "authzed/actions/setup-go@main"
      - uses: "docker/login-action@dbcb813823bdd20940b903addbd779551569679f" # v4.6.0
        with:
          username: "${{ env.DOCKERHUB_PUBLIC_USER }}"
          password: "${{ env.DOCKERHUB_PUBLIC_ACCESS_TOKEN }}"
      - name: "Integration tests with coverage"
        run: "go run mage.go test:integrationCover"
      - name: "Coverage"
        uses: "codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5" # v7.1.1
        with:
          files: "./coverage.txt"
          token: "${{ secrets.CODECOV_TOKEN }}"
          fail_ci_if_error: false

  datastoreinttest:
    name: "Datastore Integration Tests"
    runs-on: "depot-ubuntu-24.04-arm-8"
    needs: "paths-filter"
    strategy:
      fail-fast: false
      matrix:
        datastore: ["mysql", "spanner"]
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        if: |
          needs.paths-filter.outputs.codechange == 'true'
      - uses: "authzed/actions/setup-go@main"
        if: |
          needs.paths-filter.outputs.codechange == 'true'
      - uses: "docker/login-action@dbcb813823bdd20940b903addbd779551569679f" # v4.6.0
        if: |
          needs.paths-filter.outputs.codechange == 'true'
        with:
          username: "${{ env.DOCKERHUB_PUBLIC_USER }}"
          password: "${{ env.DOCKERHUB_PUBLIC_ACCESS_TOKEN }}"
      - name: "Integration tests"
        if: |
          needs.paths-filter.outputs.codechange == 'true'
        run: "go run mage.go testds:${{ matrix.datastore }}"
      - name: "Coverage"
        if: |
          needs.paths-filter.outputs.codechange == 'true'
        uses: "codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5" # v7.1.1
        with:
          files: "./coverage.txt"
          token: "${{ secrets.CODECOV_TOKEN }}"
          fail_ci_if_error: false

  datastoreconstest:
    name: "Datastore Consistency Tests"
    runs-on: "depot-ubuntu-24.04-arm-16"
    needs: "paths-filter"
    strategy:
      fail-fast: false
      matrix:
        datastore: ["mysql", "spanner"]
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        if: |
          needs.paths-filter.outputs.codechange == 'true'
      - uses: "authzed/actions/setup-go@main"
        if: |
          needs.paths-filter.outputs.codechange == 'true'
      - uses: "docker/login-action@dbcb813823bdd20940b903addbd779551569679f" # v4.6.0
        if: |
          needs.paths-filter.outputs.codechange == 'true'
        with:
          username: "${{ env.DOCKERHUB_PUBLIC_USER }}"
          password: "${{ env.DOCKERHUB_PUBLIC_ACCESS_TOKEN }}"
      - name: "Consistency tests"
        if: |
          needs.paths-filter.outputs.codechange == 'true'
        run: "go run mage.go testcons:${{ matrix.datastore }}"
      - name: "Coverage"
        if: |
          needs.paths-filter.outputs.codechange == 'true'
        uses: "codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5" # v7.1.1
        with:
          files: "./coverage.txt"
          token: "${{ secrets.CODECOV_TOKEN }}"
          fail_ci_if_error: false

  pgdatastoreinttest:
    name: "Datastore Integration Tests"
    runs-on: "depot-ubuntu-24.04-arm-8"
    needs: "paths-filter"
    strategy:
      fail-fast: false
      matrix:
        datastore: ["postgres", "pgbouncer"]
        pgversion: ["14", "15", "16", "17", "18"]
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        if: |
          needs.paths-filter.outputs.codechange == 'true'
      - uses: "authzed/actions/setup-go@main"
        if: |
          needs.paths-filter.outputs.codechange == 'true'
      - uses: "docker/login-action@dbcb813823bdd20940b903addbd779551569679f" # v4.6.0
        if: |
          needs.paths-filter.outputs.codechange == 'true'
        with:
          username: "${{ env.DOCKERHUB_PUBLIC_USER }}"
          password: "${{ env.DOCKERHUB_PUBLIC_ACCESS_TOKEN }}"
      - name: "Integration tests"
        if: |
          needs.paths-filter.outputs.codechange == 'true'
        run: "go run mage.go testds:${{ matrix.datastore }}ver ${{ matrix.pgversion }}"
      - name: "Coverage"
        if: |
          needs.paths-filter.outputs.codechange == 'true'
        uses: "codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5" # v7.1.1
        with:
          files: "./coverage.txt"
          token: "${{ secrets.CODECOV_TOKEN }}"
          fail_ci_if_error: false

  pgdatastoreconstest:
    name: "Datastore Consistency Tests"
    runs-on: "depot-ubuntu-24.04-arm-16"
    needs: "paths-filter"
    strategy:
      fail-fast: false
      matrix:
        datastore: ["postgres"]
        pgversion: ["14", "15", "16", "17", "18"]
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        if: |
          needs.paths-filter.outputs.codechange == 'true'
      - uses: "authzed/actions/setup-go@main"
        if: |
          needs.paths-filter.outputs.codechange == 'true'
      - uses: "docker/login-action@dbcb813823bdd20940b903addbd779551569679f" # v4.6.0
        if: |
          needs.paths-filter.outputs.codechange == 'true'
        with:
          username: "${{ env.DOCKERHUB_PUBLIC_USER }}"
          password: "${{ env.DOCKERHUB_PUBLIC_ACCESS_TOKEN }}"
      - name: "Consistency tests"
        if: |
          needs.paths-filter.outputs.codechange == 'true'
        run: "go run mage.go testcons:postgresver ${{ matrix.pgversion }}"
      - name: "Coverage"
        if: |
          needs.paths-filter.outputs.codechange == 'true'
        uses: "codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5" # v7.1.1
        with:
          files: "./coverage.txt"
          token: "${{ secrets.CODECOV_TOKEN }}"
          fail_ci_if_error: false

  crdbdatastoreinttest:
    name: "Datastore Integration Tests"
    runs-on: "depot-ubuntu-24.04-arm-8"
    needs: "paths-filter"
    strategy:
      fail-fast: false
      matrix:
        datastore: ["crdb"]
        crdbversion:
          # the version many folks are on
          - "25.2.0"
          # the most recent version
          - "26.2.5"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        if: |
          needs.paths-filter.outputs.codechange == 'true'
      - uses: "authzed/actions/setup-go@main"
        if: |
          needs.paths-filter.outputs.codechange == 'true'
      - uses: "docker/login-action@dbcb813823bdd20940b903addbd779551569679f" # v4.6.0
        if: |
          needs.paths-filter.outputs.codechange == 'true'
        with:
          username: "${{ env.DOCKERHUB_PUBLIC_USER }}"
          password: "${{ env.DOCKERHUB_PUBLIC_ACCESS_TOKEN }}"
      - name: "Integration tests"
        if: |
          needs.paths-filter.outputs.codechange == 'true'
        run: "go run mage.go testds:${{ matrix.datastore }}ver ${{ matrix.crdbversion }}"
      - name: "Coverage"
        if: |
          needs.paths-filter.outputs.codechange == 'true'
        uses: "codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5" # v7.1.1
        with:
          files: "./coverage.txt"
          token: "${{ secrets.CODECOV_TOKEN }}"
          fail_ci_if_error: false

  crdbdatastoreconstest:
    name: "Datastore Consistency Tests"
    runs-on: "depot-ubuntu-24.04-arm-16"
    needs: "paths-filter"
    strategy:
      fail-fast: false
      matrix:
        datastore: ["crdb"]
        crdbversion:
          # the version many folks are on
          - "25.2.0"
          # the most recent version
          - "26.2.5"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        if: |
          needs.paths-filter.outputs.codechange == 'true'
      - uses: "authzed/actions/setup-go@main"
        if: |
          needs.paths-filter.outputs.codechange == 'true'
      - uses: "docker/login-action@dbcb813823bdd20940b903addbd779551569679f" # v4.6.0
        if: |
          needs.paths-filter.outputs.codechange == 'true'
        with:
          username: "${{ env.DOCKERHUB_PUBLIC_USER }}"
          password: "${{ env.DOCKERHUB_PUBLIC_ACCESS_TOKEN }}"
      - name: "Consistency tests"
        if: |
          needs.paths-filter.outputs.codechange == 'true'
        run: "go run mage.go testcons:crdbver ${{ matrix.crdbversion }}"
      - name: "Coverage"
        if: |
          needs.paths-filter.outputs.codechange == 'true'
        uses: "codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5" # v7.1.1
        with:
          files: "./coverage.txt"
          token: "${{ secrets.CODECOV_TOKEN }}"
          fail_ci_if_error: false

  e2e:
    # NOTE: the name is hardcoded (rather than using a matrix) so that the check context stays
    # "E2E (22.1.5)" whether the job runs or is skipped. A matrix job that is skipped via a
    # job-level `if` reports as bare "E2E", which never satisfies the required "E2E (22.1.5)"
    # branch-protection check, leaving non-code PRs stuck on "Expected — Waiting for status".
    # TODO update to 25.x when we figure out how to override the clock
    name: "E2E (22.1.5)"
    # NOTE: the e2e tests can't be run on ARM because chaosd (which is used in the cockroach e2e consistency tests)
    # doesn't support ARM and it doesn't appear that it will.
    runs-on: "depot-ubuntu-24.04-8"
    needs: "paths-filter"
    if: |
      needs.paths-filter.outputs.codechange == 'true'
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      - uses: "authzed/actions/setup-go@main"
        with:
          go-version-file: "e2e/go.mod"
          cache-dependency-path: "e2e/go.sum"
      - name: "Run e2e"
        run: "go run mage.go test:e2e 22.1.5"
      - uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
        if: "always()"
        # this upload step is really flaky, don't fail the job if it fails
        continue-on-error: true
        with:
          name: "node-logs"
          path: "e2e/newenemy/*.log"
  analyzers-unit-tests:
    name: "Analyzers Unit Tests"
    runs-on: "depot-ubuntu-24.04-arm-small"
    needs: "paths-filter"
    if: |
      needs.paths-filter.outputs.codechange == 'true'
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      - uses: "authzed/actions/setup-go@main"
        with:
          go-version-file: "tools/analyzers/go.mod"
          cache-dependency-path: "tools/analyzers/go.sum"
      - name: "Analyzer tests"
        run: "go run mage.go test:analyzers"
  development:
    name: "WASM Tests"
    runs-on: "depot-ubuntu-24.04-arm-8"
    needs: "paths-filter"
    if: |
      needs.paths-filter.outputs.codechange == 'true'
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      - uses: "authzed/actions/setup-go@main"
      # Headless Chrome needs unprivileged user namespaces to sandbox, which
      # Ubuntu 23.10+ restricts via AppArmor. Kernels built without that
      # restriction do not expose the knob at all, and there is nothing to
      # disable on them, so its absence is not a failure.
      # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
      - name: "Disable AppArmor"
        if: "runner.os == 'Linux'"
        run: |
          knob="/proc/sys/kernel/apparmor_restrict_unprivileged_userns"
          if [ -e "${knob}" ]; then
            echo 0 | sudo tee "${knob}"
          else
            echo "${knob} is absent; no restriction to disable"
          fi
      # The image's Chromium is a snap, and snapd here cannot update its AppArmor
      # profiles, so it never starts: "timeout waiting for snap system profiles
      # to get updated". wasmbrowsertest gives no way to point chromedp at a
      # binary, and chromedp searches PATH for "chromium" ahead of every other
      # name, so install a known-good build and put it on PATH under that name
      # rather than depend on whatever browser the image happens to ship.
      - name: "Install Chromium"
        env:
          PLAYWRIGHT_VERSION: "1.63.0"
        run: |
          cd "${RUNNER_TEMP}"
          npm install --no-save "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium
          mkdir -p "${RUNNER_TEMP}/browser-bin"
          ln -s "$(node -e 'console.log(require("playwright").chromium.executablePath())')" \
            "${RUNNER_TEMP}/browser-bin/chromium"
          echo "${RUNNER_TEMP}/browser-bin" >> "${GITHUB_PATH}"
      # cleanenv is a util provided by the wasmbrowsertest package that removes
      # environment variables from the environment handed to wasmbrowsertest.
      # this works around https://github.com/agnivade/wasmbrowsertest/issues/40,
      # which we were experiencing on depot.
      - name: "Install cleanenv"
        run: "go install github.com/agnivade/wasmbrowsertest/cmd/cleanenv@latest"
      - name: "WASM tests"
        # There's a whole bunch of vars in the environment that aren't needed for running this test, so we clear them out.
        # NOTE: if you need to do this in the future, I recommend bashing into the container and running `env | sort | less`
        run: "cleanenv -remove-prefix GITHUB_ -remove-prefix ANDROID_ -remove-prefix JAVA_ -remove-prefix DOTNET_ -remove-prefix RUNNER_ -remove-prefix HOMEBREW_ -remove-prefix runner_ -- go run mage.go test:wasm"

  protobuf:
    name: "Generate Protobufs"
    runs-on: "depot-ubuntu-24.04-arm-small"
    needs: "paths-filter"
    if: |
      needs.paths-filter.outputs.protochange == 'true'
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      - uses: "authzed/actions/setup-go@main"
      - name: "Generate Protos"
        run: "go run mage.go gen:proto"
      - uses: "chainguard-dev/actions/nodiff@0bacfe710021b5ad6d8886a53a34c40072f2fc90" # main
        with:
          path: ""
          fixup-command: "go run mage.go gen:proto"
      - uses: "bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99" # v1.50.0
      - uses: "bufbuild/buf-breaking-action@c57b3d842a5c3f3b454756ef65305a50a587c5ba" # v1.1.4 TODO(miparnisari) deprecated, use buf-action
        if: "github.event_name == 'pull_request'"
        env:
          BUF_INPUT_HTTPS_USERNAME: "${{ github.actor }}"
          BUF_INPUT_HTTPS_PASSWORD: "${{ github.token }}"
        with:
          input: "proto/internal"
          against: "https://github.com/authzed/spicedb.git#branch=main,subdir=proto/internal"
          buf_token: "${{ secrets.BUF_REGISTRY_TOKEN }}"

  benchmarks:
    name: "Run Go benchmarks"
    runs-on: "depot-ubuntu-24.04-arm-8" # same as benchmark.yaml
    # The job builds both revisions and, when they differ, measures them
    # interleaved. `benchmark:compare` caps its own measurement phase at
    # BENCH_BUDGET, so the job should finish well inside this.
    timeout-minutes: 40
    needs: "paths-filter"
    # Benchmarks on Main are ran through a different workflow
    if: |
      needs.paths-filter.outputs.codechange == 'true' &&
      github.event_name == 'pull_request' &&
      github.base_ref == 'main'
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          # The comparison builds the merge-base with main, so the whole history
          # has to be here; the default depth of 1 cannot resolve a merge-base.
          fetch-depth: 0

      - uses: "authzed/actions/setup-go@main"
        with:
          go-version-file: "./go.mod"
          cache-dependency-path: "./go.sum"

      - name: "Install benchstat"
        run: "go install golang.org/x/perf/cmd/benchstat@latest"

      - name: "Compare benchmarks against the merge-base with main"
        # Builds the benchmark binaries at this branch and at its merge-base
        # with main. Packages whose two binaries are byte-identical cannot have
        # changed and are skipped; the rest are run A/B/A/B on this one runner
        # and compared with benchstat. Results go to the job summary only: this
        # check reports, it does not gate.
        run: "go run mage.go benchmark:compare"
