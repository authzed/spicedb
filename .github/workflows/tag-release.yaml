name: Tag Release from SYNC.md
on:
  push:
    branches:
      - main
    paths:
      - 'SYNC.md'

permissions:
  contents: read

jobs:
  tag-release:
    name: Create release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Read version from SYNC.md
        id: version
        run: |
          _line=$(grep '^TAG:' SYNC.md)
          VERSION=${_line#*: }
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Check if tag already exists
        id: check-tag
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create and push tag
        if: steps.check-tag.outputs.exists == 'false'
        run: |
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"
      - name: Check if GitHub release already exists
        id: check-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub release
        if: steps.check-release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --verify-tag \
            --title "${{ steps.version.outputs.version }}" \
            --generate-notes
